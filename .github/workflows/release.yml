# Gera o instalador e a versão portátil e publica a Release quando uma tag vX.Y.Z é enviada
# (vX.Y.Z-beta.N publica como pré-lançamento, para testes).
#   1. mude a versão em sann/version.py e faça o commit
#   2. git tag v1.2.0 && git push origin v1.2.0
# A SannStation instalada encontra a Release nova sozinha (Configurações → Atualizações).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Versão da tag confere com sann/version.py
        shell: pwsh
        run: |
          $v = (Select-String -Path sann\version.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          # v1.2.0 = versão oficial; v1.2.0-beta.1 (ou -rc.1…) = versão de teste, publicada como pré-lançamento
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$v" -and -not $tag.StartsWith("v$v-")) { throw "A tag $tag não confere com a versão $v em sann/version.py" }
      - name: Testes
        run: python -m unittest discover -s tests -v
      - name: Build (instalador + portátil)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File build\build.ps1
      - name: Publicar a Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $extra = @()
          # Pré-lançamento não aparece como atualização automática (o app só olha a última Release oficial).
          if ($tag.Contains("-")) { $extra = @("--prerelease") }
          $files = Get-ChildItem dist\* | ForEach-Object FullName
          # Release criada pela página do GitHub (que também cria a tag): só anexa os arquivos.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files --clobber
          } else {
            gh release create $tag $files --title "SannStation $($tag.TrimStart('v'))" --generate-notes @extra
          }
